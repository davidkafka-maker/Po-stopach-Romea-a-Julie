<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Po stopách Romea a Julie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --night:#120911;
      --wine:#7f1426;
      --wine2:#a01f34;
      --gold:#f0bd56;
      --paper:#fff6e4;
      --ink:#261016;
      --blue:#1265d8;
      --red:#c51f2f;
      --green:#188a3c;
      --shadow:rgba(0,0,0,.45);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      padding:14px;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(240,189,86,.34), transparent 18%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,.12), transparent 14%),
        linear-gradient(135deg, #10070d 0%, #3a101d 58%, #070408 100%);
      display:flex;
      justify-content:center;
      align-items:stretch;
    }
    .app {
      width:min(1040px,100%);
      min-height:calc(100vh - 28px);
      background:
        linear-gradient(rgba(255,246,228,.94), rgba(255,246,228,.96)),
        repeating-linear-gradient(45deg, rgba(127,20,38,.04), rgba(127,20,38,.04) 8px, transparent 8px, transparent 18px);
      border:7px double var(--gold);
      border-radius:26px;
      box-shadow:0 24px 80px var(--shadow);
      padding:22px;
      position:relative;
      overflow:hidden;
    }
    .app::before {
      content:"";
      position:absolute;
      inset:14px;
      border:1px solid rgba(127,20,38,.18);
      border-radius:18px;
      pointer-events:none;
    }
    h1 {
      margin:8px 0 4px;
      text-align:center;
      color:var(--wine);
      font-size:clamp(34px,5.5vw,62px);
      text-shadow:0 2px 0 rgba(240,189,86,.45);
      letter-spacing:.4px;
    }
    .subtitle {
      text-align:center;
      color:#6a303a;
      font-size:18px;
      margin:0 0 18px;
    }
    .card {
      background:rgba(255,255,255,.76);
      border:2px solid rgba(127,20,38,.22);
      border-radius:22px;
      padding:20px;
      margin:14px 0;
      box-shadow:0 10px 28px rgba(61,20,28,.12);
    }
    .startCard {
      max-width:760px;
      margin:20px auto 0;
      padding:24px;
    }
    .row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    label {
      display:block;
      font-weight:bold;
      margin-bottom:7px;
      color:#4b2028;
      font-size:18px;
    }
    input {
      width:100%;
      padding:14px 15px;
      border-radius:15px;
      border:2px solid rgba(127,20,38,.36);
      font-size:19px;
      background:#fff;
      outline:none;
    }
    input:focus {
      border-color:var(--wine2);
      box-shadow:0 0 0 4px rgba(160,31,52,.14);
    }
    button, a.btn {
      cursor:pointer;
      border:0;
      border-radius:18px;
      padding:16px 24px;
      font-weight:bold;
      font-size:20px;
      color:white;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing:.3px;
      transition:transform .08s ease, filter .12s ease;
    }
    button:active, a.btn:active { transform:translateY(2px); }
    .btnTest {
      background:linear-gradient(135deg, #a71934, #6f1022);
      box-shadow:0 6px 0 #4d0b17, 0 10px 24px rgba(127,20,38,.28);
    }
    .btnTable {
      background:linear-gradient(135deg, #2d6cdf, #17408c);
      box-shadow:0 6px 0 #102c61, 0 10px 24px rgba(18,101,216,.25);
    }
    .btnMenu {
      background:linear-gradient(135deg, #7b5422, #4c3212);
      box-shadow:0 6px 0 #2e1d0a;
    }
    button:hover, a.btn:hover { filter:brightness(1.06); }
    button:disabled { opacity:.65; cursor:not-allowed; transform:none; }
    .center { text-align:center; }
    .hidden { display:none !important; }
    .startButtons {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-top:22px;
    }
    .topbar {
      display:grid;
      grid-template-columns:1fr 1.1fr 1fr;
      gap:12px;
      align-items:center;
      margin:10px 0 14px;
    }
    .pill {
      background:linear-gradient(135deg, #f8e6bd, #efd18a);
      border:1px solid rgba(127,20,38,.25);
      padding:10px 13px;
      border-radius:999px;
      color:#562730;
      font-weight:bold;
      text-align:center;
      box-shadow:0 4px 12px rgba(61,20,28,.10);
    }
    #timeText {
      font-size:clamp(22px,3.2vw,34px);
      color:#7f1426;
      padding:10px 16px;
      border:2px solid rgba(127,20,38,.34);
      text-shadow:0 2px 0 rgba(255,255,255,.55);
    }
    .timerWrap {
      background:#ead0a0;
      border-radius:999px;
      overflow:hidden;
      height:18px;
      border:1px solid rgba(127,20,38,.25);
      margin:8px 0 2px;
    }
    .timerBar {
      height:100%;
      width:100%;
      background:linear-gradient(90deg, #2d9b4d, #f0bd56, #c51f2f);
      transition:width .15s linear;
    }
    .questionCard {
      position:relative;
      padding:24px;
      background:
        radial-gradient(circle at top left, rgba(240,189,86,.18), transparent 34%),
        rgba(255,255,255,.80);
    }
    .question {
      font-size:clamp(23px,3vw,33px);
      line-height:1.35;
      margin:8px 0 22px;
      color:#260c13;
      font-weight:bold;
      text-align:center;
    }
    .answers {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .answer {
      min-height:92px;
      text-align:left;
      background:linear-gradient(135deg, #fffefb, #f8ead0);
      color:var(--ink);
      box-shadow:0 5px 0 rgba(127,20,38,.18), 0 9px 20px rgba(0,0,0,.08);
      border:2px solid rgba(127,20,38,.26);
      font-size:19px;
      line-height:1.25;
      padding:15px 16px;
    }

    .answer:disabled {
      opacity:1;
      cursor:default;
      filter:none;
    }

    .answer:hover {
      border-color:var(--wine2);
      transform:translateY(-1px);
    }
    .answer.correctReveal {
      background:linear-gradient(135deg, #e4f0ff, #5fa1ff) !important;
      border-color:var(--blue) !important;
      color:#041f52 !important;
      box-shadow:0 5px 0 #0d4fae, 0 0 0 6px rgba(18,101,216,.20) !important;
    }
    .answer.wrongReveal {
      background:linear-gradient(135deg, #ffd1d1, #df2636) !important;
      border-color:var(--red) !important;
      color:#ffffff !important;
      box-shadow:0 5px 0 #8d1520, 0 0 0 6px rgba(197,31,47,.22) !important;
    }
    .feedback {
      margin-top:18px;
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(24px,3.4vw,36px);
      font-weight:bold;
      text-align:center;
    }
    .feedback.good { color:var(--green); }
    .feedback.bad { color:var(--red); }
    .feedback.blue { color:var(--blue); }
    .result-big {
      font-size:clamp(32px,5vw,54px);
      color:var(--wine);
      font-weight:bold;
      margin:12px 0;
      text-shadow:0 2px 0 rgba(240,189,86,.45);
    }

    .resultScore {
      margin: 18px auto;
      max-width: 460px;
      padding: 18px 20px;
      border-radius: 20px;
      background: linear-gradient(135deg,#fff7d6,#f2d076);
      border: 3px solid #d2a22b;
      box-shadow: 0 9px 24px rgba(0,0,0,.16);
    }
    .resultLabel {
      font-size: 22px;
      font-weight: bold;
      color: #7f1426;
      margin-bottom: 8px;
      letter-spacing: .5px;
    }
    .resultValue {
      font-size: clamp(42px,7vw,62px);
      font-weight: bold;
      color: #1265d8;
      line-height: 1;
    }
    .resultGrade {
      font-size: clamp(54px,9vw,78px);
      font-weight: bold;
      color: #188a3c;
      line-height: 1;
    }

    .small { color:#684047; font-size:14px; }
    .bottomMenu {
      margin-top:22px;
      padding-top:16px;
      border-top:2px solid rgba(127,20,38,.18);
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }
    @media(max-width:720px){
      body{padding:7px;}
      .app{padding:13px; border-width:4px;}
      .row, .startButtons, .topbar, .answers{grid-template-columns:1fr;}
      button, a.btn{width:100%;}
      .answer{font-size:17px; min-height:74px;}
      .questionCard{padding:16px;}
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Po stopách Romea a Julie</h1>
  <div class="subtitle">test skutečné četby</div>

  <section id="screenStart" class="card startCard">
    <div class="row">
      <div>
        <label for="surname">Příjmení</label>
        <input id="surname" autocomplete="family-name" placeholder="např. Novák">
      </div>
      <div>
        <label for="className">Třída</label>
        <input id="className" placeholder="např. 2.A">
      </div>
    </div>

    <div class="startButtons">
      <button class="btnTest" onclick="startQuiz()">TEST</button>
      <a class="btn btnTable" href="https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing" target="_blank" rel="noopener">VÝSLEDKOVÁ TABULKA</a>
    </div>
  </section>

  <section id="screenQuiz" class="hidden">
    <div class="topbar">
      <div class="pill" id="progress">Otázka 1/20</div>
      <div>
        <div class="pill" id="timeText">Čas: 20 s</div>
        <div class="timerWrap"><div class="timerBar" id="timerBar"></div></div>
      </div>
      <div class="pill" id="score">Body: 0</div>
    </div>

    <div class="card questionCard">
      <div id="question" class="question"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
    </div>
  </section>

  <section id="screenResult" class="card startCard hidden">
    <div class="center">
      <div class="result-big" id="finalTitle"></div>
      <div id="finalText"></div>
      <p id="sendStatus" class="small"></p>
      <div class="bottomMenu">
        <button class="btnMenu" onclick="goMenu()">HLAVNÍ MENU</button>
        <a class="btn btnTable" href="https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing" target="_blank" rel="noopener">VÝSLEDKOVÁ TABULKA</a>
      </div>
    </div>
  </section>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxn5Tb-0pvVDmjQeehPa6AgvwDE5TAXEwE7lxg95Ulo2Lbi1Bye7LF9IjP25wWgskMx/exec";
const APP_NAME = "Po stopách Romea a Julie";
const TABLE_URL = "https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing";
const TEST_COUNT = 20;
const PASS_LIMIT = 14;
const QUESTION_TIME = 20;
const REVEAL_TIME = 2000;

const QUESTIONS = [
  {
    q: "Na jaké slavnosti se Romeo poprvé setká s Julií?",
    a: ["na maškarním plese Monteků", "na maškarním plese Kapuletů", "na slavnosti pořádané veronským knížetem", "na oslavě Juliiných narozenin"],
    correct: "na maškarním plese Kapuletů"
  },
  {
    q: "Proč se Romeo původně rozhodne navštívit slavnost Kapuletů?",
    a: ["chce spatřit Rosalinu", "chce vyzvat Tybalta", "chce požádat Kapuleta o smír", "chce se setkat s Julií"],
    correct: "chce spatřit Rosalinu"
  },
  {
    q: "Kdo Romea přemlouvá, aby šel na slavnost Kapuletů?",
    a: ["Mercutio a Benvolio", "Paris a Tybalt", "Vavřinec a Benvolio", "Chůva a Mercutio"],
    correct: "Mercutio a Benvolio"
  },
  {
    q: "Podle čeho Tybalt pozná Romea na slavnosti Kapuletů?",
    a: ["podle hlasu", "podle masky", "podle pláště", "podle meče"],
    correct: "podle hlasu"
  },
  {
    q: "Jaký důvod Kapulet uvádí, když Tybaltovi zakazuje napadnout Romea?",
    a: ["Romeo je na plese hostem", "Romeo je příbuzný Kapuletů", "Romeo přišel s knížetem", "Tybalt nemá právo nosit meč"],
    correct: "Romeo je na plese hostem"
  },
  {
    q: "K čemu Romeo a Julie přirovnávají svůj první rozhovor před polibkem?",
    a: ["k modlitbě", "k souboji", "k tanci", "k pohřbu"],
    correct: "k modlitbě"
  },
  {
    q: "Kdo Romeovi sdělí, že dívka, s níž právě mluvil, je dcera Kapuletova?",
    a: ["Chůva", "Benvolio", "Mercutio", "Vavřinec"],
    correct: "Chůva"
  },
  {
    q: "Odkud Romeo sleduje Julii během slavné noční scény po plese?",
    a: ["ze zahrady pod jejím oknem", "z ulice před domem Monteků", "z věže Kapuletova domu", "z klášterní zahrady"],
    correct: "ze zahrady pod jejím oknem"
  },
  {
    q: "Co Julii během balkonové scény nejvíce trápí?",
    a: ["Romeovo jméno a původ", "Romeova chudoba", "Romeův nízký věk", "Romeovo přátelství s Mercutiem"],
    correct: "Romeovo jméno a původ"
  },
  {
    q: "Kdo zprostředkovává tajné spojení mezi Romeem a Julií?",
    a: ["Chůva", "Benvolio", "Paris", "Tybalt"],
    correct: "Chůva"
  },
  {
    q: "Jaký přínos očekává Vavřinec od sňatku Romea a Julie?",
    a: ["ukončení nepřátelství mezi rody", "Romeův návrat do přízně knížete", "Juliin vstup do kláštera", "získání Kapuletova majetku"],
    correct: "ukončení nepřátelství mezi rody"
  },
  {
    q: "Jak reaguje Chůva na Juliinu lásku k Romeovi v první části hry?",
    a: ["pomáhá jí", "okamžitě vše prozradí Kapuletovi", "odmítne s Julií mluvit", "přemlouvá Romea, aby odešel z Verony"],
    correct: "pomáhá jí"
  },
  {
    q: "Jak Mercutio reaguje, když Romeo odmítne Tybaltovu výzvu?",
    a: ["sám přijímá souboj", "odchází pro knížete", "přemlouvá Tybalta ke smíru", "doprovází Romea k Vavřinci"],
    correct: "sám přijímá souboj"
  },
  {
    q: "Proč Romeo odmítá s Tybaltem bojovat?",
    a: ["Tybalt je nyní jeho příbuzný", "nemá u sebe meč", "bojí se trestu smrti", "Tybalt ho předtím zachránil"],
    correct: "Tybalt je nyní jeho příbuzný"
  },
  {
    q: "Jak Mercutio utrpí smrtelné zranění při střetu s Tybaltem?",
    a: ["Tybalt ho zasáhne, když Romeo vstoupí mezi ně", "Romeo ho omylem probodne při obraně", "Benvolio ho nechtěně srazí k zemi", "Paris ho zasáhne ze zálohy"],
    correct: "Tybalt ho zasáhne, když Romeo vstoupí mezi ně"
  },
  {
    q: "Jak zní smysl Mercutiovy kletby před smrtí?",
    a: ["Mor na oba vaše rody.", "Ať Verona navždy padne.", "Kletba jen na Kapulety.", "Pomsta za Romea."],
    correct: "Mor na oba vaše rody."
  },
  {
    q: "Co Romeo udělá po Mercutiově smrti?",
    a: ["zabije Tybalta", "odchází do Mantovy", "vyhledá Vavřince", "přizná se Kapuletovi"],
    correct: "zabije Tybalta"
  },
  {
    q: "Jaký trest dostane Romeo za zabití Tybalta?",
    a: ["vyhnanství", "popravu", "vězení", "ztrátu majetku"],
    correct: "vyhnanství"
  },
  {
    q: "Kdo oznámí Julii, že Tybalt je mrtev a Romeo vyhnán?",
    a: ["Chůva", "Vavřinec", "Benvolio", "Kapulet"],
    correct: "Chůva"
  },
  {
    q: "Jak Julie reaguje na zprávu o činu Romea, který zabil Tybalta?",
    a: ["je rozpolcená mezi bolestí z Tybaltovy smrti a láskou k Romeovi", "okamžitě Romea zavrhne", "radostně přijme Tybaltovu smrt", "odmítne uvěřit, že Romeo žije"],
    correct: "je rozpolcená mezi bolestí z Tybaltovy smrti a láskou k Romeovi"
  },
  {
    q: "Kde Romeo po rozsudku vyhnanství vyhledá úkryt?",
    a: ["u Vavřince", "u Benvolia", "v Kapuletově domě", "u veronského knížete"],
    correct: "u Vavřince"
  },
  {
    q: "Kdo přichází k Vavřinci za Romeem se zprávami od Julie?",
    a: ["Chůva", "Benvolio", "Baltazar", "Paris"],
    correct: "Chůva"
  },
  {
    q: "Jakého ptáka Julie zmiňuje, když chce Romea přesvědčit, že ještě není ráno?",
    a: ["slavíka", "skřivana", "havrana", "sokola"],
    correct: "slavíka"
  },
  {
    q: "Jak se jmenuje veronský kníže, který trestá veřejné násilí mezi rody?",
    a: ["Escalus", "Paris", "Baltazar", "Sampson"],
    correct: "Escalus"
  },
  {
    q: "Která dvojice sluhů Kapuletových vystupuje v úvodní hádce na ulici?",
    a: ["Sampson a Řehoř", "Baltazar a Abraham", "Petr a Jan", "Sampson a Benvolio"],
    correct: "Sampson a Řehoř"
  },
  {
    q: "Koho chtějí Juliini rodiče provdat za Julii?",
    a: ["Parise", "Benvolia", "Mercutia", "Tybaltova bratra"],
    correct: "Parise"
  },
  {
    q: "Jak Kapulet reaguje, když Julie odmítne sňatek s Parisem?",
    a: ["zuřivě jí vyhrožuje", "klidně svatbu odloží", "pošle ji za Romeem", "požádá Vavřince o radu"],
    correct: "zuřivě jí vyhrožuje"
  },
  {
    q: "Jakou radu dá Chůva Julii po Romeově vyhnanství?",
    a: ["aby si vzala Parise", "aby uprchla s Romeem", "aby vstoupila do kláštera", "aby vše řekla knížeti"],
    correct: "aby si vzala Parise"
  },
  {
    q: "Jaký prostředek dá Vavřinec Julii, aby se vyhnula sňatku s Parisem?",
    a: ["nápoj navozující zdánlivou smrt", "dopis pro Kapuleta", "jed pro Parise", "klíč od městské brány"],
    correct: "nápoj navozující zdánlivou smrt"
  },
  {
    q: "Čeho se Julie před vypitím Vavřincova nápoje mimo jiné obává?",
    a: ["že se probudí v hrobce mezi mrtvými", "že ztratí hlas", "že ji Romeo přestane milovat", "že ji kníže odsoudí k smrti"],
    correct: "že se probudí v hrobce mezi mrtvými"
  },
  {
    q: "Kdo jako první najde Julii v domnění, že zemřela?",
    a: ["Chůva", "Paris", "Kapulet", "Vavřinec"],
    correct: "Chůva"
  },
  {
    q: "Komu Vavřinec svěří dopis, který má vysvětlit Romeovi plán s Julií?",
    a: ["bratru Janovi", "Benvoliovi", "Baltazarovi", "Mercutiovi"],
    correct: "bratru Janovi"
  },
  {
    q: "Proč se Vavřincův dopis k Romeovi nedostane včas?",
    a: ["posel je zdržen kvůli podezření na morovou nákazu", "posel dopis ztratí v Mantově", "Kapuleti dopis zabaví", "Romeo odmítne dopis převzít"],
    correct: "posel je zdržen kvůli podezření na morovou nákazu"
  },
  {
    q: "Od koho se Romeo v Mantově dozví, že Julie je údajně mrtvá?",
    a: ["od Baltazara", "od Vavřince", "od Benvolia", "od Parise"],
    correct: "od Baltazara"
  },
  {
    q: "Co si Romeo obstará v Mantově po zprávě o Juliině smrti?",
    a: ["jed", "mnišské roucho", "dopis pro knížete", "svatební prsten"],
    correct: "jed"
  },
  {
    q: "Kdo se střetne s Romeem u Kapuletovy hrobky?",
    a: ["Paris", "Tybalt", "Benvolio", "Kapulet"],
    correct: "Paris"
  },
  {
    q: "Proč je Paris u Juliiny hrobky?",
    a: ["přišel truchlit za Julii", "chce varovat Romea", "hledá Vavřince", "střeží hrobku před Kapulety"],
    correct: "přišel truchlit za Julii"
  },
  {
    q: "Co Romeo udělá s Parisovým tělem po souboji u hrobky?",
    a: ["uloží ho do hrobky", "nechá ho před hrobkou", "odnese ho k Vavřinci", "předá ho strážím"],
    correct: "uloží ho do hrobky"
  },
  {
    q: "Jakým způsobem Julie skutečně zemře?",
    a: ["probodne se dýkou", "vypije jed", "skočí z hradby", "udusí se v hrobce"],
    correct: "probodne se dýkou"
  },
  {
    q: "Co se stane mezi Monteky a Kapulety po smrti Romea a Julie?",
    a: ["rody se smíří", "Montekové jsou vyhnáni", "Kapuleti jsou odsouzeni k smrti", "Vavřinec se stane knížetem"],
    correct: "rody se smíří"
  }
];

let quiz = [];
let index = 0;
let points = 0;
let locked = false;
let started = false;
let finished = false;
let cheatTimer = null;
let timeLeft = QUESTION_TIME;
let timerInterval = null;
let revealTimeout = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let audioCtx = null;

function ensureAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch(e) {}
}

function sound(freq1, freq2, length=0.24, gainMax=0.50, type="triangle") {
  try {
    ensureAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.setValueAtTime(freq1, now);
    if (freq2 && freq2 !== freq1) {
      osc.frequency.exponentialRampToValueAtTime(freq2, now + length * 0.75);
    }

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(gainMax, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

    osc.start(now);
    osc.stop(now + length + 0.04);
  } catch(e) {}
}

function soundGood() {
  sound(720, 980, .18, .42, "triangle");
  setTimeout(() => sound(980, 1320, .16, .42, "triangle"), 115);
  setTimeout(() => sound(1320, 1560, .14, .35, "triangle"), 230);
}

function soundBad() {
  // Mobilně slyšitelnější chyba: vyšší, ostrý, dvojitý sestupný tón.
  sound(620, 360, 0.22, 0.70, "square");
  setTimeout(() => sound(520, 260, 0.24, 0.70, "square"), 210);
}

function soundTick() {
  sound(520, 520, .05, .16, "sine");
}

function soundCheat() {
  sound(1400, 300, .30, .75, "sawtooth");
  setTimeout(() => sound(300, 1400, .30, .75, "sawtooth"), 300);
  setTimeout(() => sound(1400, 250, .42, .80, "sawtooth"), 620);
}

function soundEnd(pass) {
  pass ? soundGood() : soundBad();
}

function startQuiz() {
  ensureAudio();
  const surname = document.getElementById("surname").value.trim();
  const className = document.getElementById("className").value.trim();

  if (!surname || !className) {
    alert("Vyplň prosím příjmení i třídu.");
    return;
  }

  quiz = shuffle(QUESTIONS).slice(0, TEST_COUNT).map(item => ({...item, a: shuffle(item.a)}));
  index = 0;
  points = 0;
  locked = false;
  started = true;
  finished = false;

  document.getElementById("screenStart").classList.add("hidden");
  document.getElementById("screenResult").classList.add("hidden");
  document.getElementById("screenQuiz").classList.remove("hidden");

  renderQuestion();
}

function renderQuestion() {
  clearTimers();
  locked = false;
  timeLeft = QUESTION_TIME;

  const item = quiz[index];
  document.getElementById("progress").textContent = `Otázka ${index + 1}/${quiz.length}`;
  document.getElementById("score").textContent = `Body: ${points}`;
  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  updateTimerDisplay();

  const box = document.getElementById("answers");
  box.innerHTML = "";

  item.a.forEach(ans => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = ans;
    btn.style.pointerEvents = "auto";
    btn.onclick = () => chooseAnswer(btn, ans);
    box.appendChild(btn);
  });

  timerInterval = setInterval(() => {
    timeLeft -= 1;
    updateTimerDisplay();
    if (timeLeft <= 3 && timeLeft > 0) soundTick();
    if (timeLeft <= 0) {
      handleWrongOrTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  document.getElementById("timeText").textContent = `Čas: ${Math.max(0, timeLeft)} s`;
  const pct = Math.max(0, Math.min(100, (timeLeft / QUESTION_TIME) * 100));
  document.getElementById("timerBar").style.width = pct + "%";
}

function chooseAnswer(btn, ans) {
  ensureAudio();
  if (locked || finished) return;
  locked = true;
  clearInterval(timerInterval);

  const item = quiz[index];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(b => b.disabled = true);

  if (ans === item.correct) {
    points++;
    btn.classList.add("correctReveal");
    document.getElementById("feedback").textContent = "SPRÁVNĚ";
    document.getElementById("feedback").className = "feedback good";
    document.getElementById("score").textContent = `Body: ${points}`;
    soundGood();
  } else {
    btn.classList.add("wrongReveal");
    const correctBtn = buttons.find(b => b.textContent === item.correct);
    if (correctBtn) correctBtn.classList.add("correctReveal");
    document.getElementById("feedback").textContent = "CHYBA";
    document.getElementById("feedback").className = "feedback bad";
    soundBad();
  }

  revealTimeout = setTimeout(nextQuestionAuto, REVEAL_TIME);
}

function handleWrongOrTimeout() {
  if (locked || finished) return;
  locked = true;
  clearInterval(timerInterval);

  const item = quiz[index];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === item.correct) b.classList.add("correctReveal");
  });

  document.getElementById("feedback").textContent = "ČAS VYPRŠEL";
  document.getElementById("feedback").className = "feedback bad";
  soundBad();

  revealTimeout = setTimeout(nextQuestionAuto, REVEAL_TIME);
}

function nextQuestionAuto() {
  index++;
  if (index >= quiz.length) finishQuiz(false);
  else renderQuestion();
}

function clearTimers() {
  clearInterval(timerInterval);
  clearTimeout(revealTimeout);
}


function getGrade(score) {
  if (score >= 18) return "1";
  if (score >= 16) return "2";
  if (score >= 14) return "3";
  if (score >= 12) return "4";
  return "5";
}

function finishQuiz(byCheat) {
  if (finished) return;
  finished = true;
  started = false;
  clearTimers();
  clearTimeout(cheatTimer);

  const passed = !byCheat && points >= PASS_LIMIT;
  const grade = byCheat ? "5" : getGrade(points);
  const vysledekText = byCheat ? "neplatné" : (passed ? "USPĚL" : "NEUSPĚL");
  const znamka = byCheat ? "5" : grade;
  const note = byCheat
    ? "Test ukončen: opuštění okna aplikace / podezření na podvod."
    : (passed ? `Splněno. Známka: ${grade}.` : `Nesplněno. Známka: ${grade}.`);

  document.getElementById("screenQuiz").classList.add("hidden");
  document.getElementById("screenResult").classList.remove("hidden");
  document.getElementById("finalTitle").textContent = byCheat ? "TEST UKONČEN" : vysledekText;
  document.getElementById("finalText").innerHTML = byCheat
    ? `
      <div class="resultScore">
        <div class="resultLabel">ZÍSKANÉ BODY</div>
        <div class="resultValue">${points}/${quiz.length}</div>
      </div>
      <div class="resultScore">
        <div class="resultLabel">ZNÁMKA</div>
        <div class="resultGrade">5</div>
      </div>
      <p class="small">Aplikace zaznamenala opuštění testu.</p>
    `
    : `
      <div class="resultScore">
        <div class="resultLabel">ZÍSKANÉ BODY</div>
        <div class="resultValue">${points}/${quiz.length}</div>
      </div>
      <div class="resultScore">
        <div class="resultLabel">ZNÁMKA</div>
        <div class="resultGrade">${grade}</div>
      </div>
      <p class="small">Limit pro úspěch: ${PASS_LIMIT}/${TEST_COUNT}.</p>
    `;

  if (byCheat) {
    soundCheat();
  } else {
    soundEnd(passed);
  }
  sendResult(znamka, note, vysledekText);
}

function goMenu() {
  clearTimers();
  document.getElementById("screenQuiz").classList.add("hidden");
  document.getElementById("screenResult").classList.add("hidden");
  document.getElementById("screenStart").classList.remove("hidden");
  document.getElementById("surname").value = "";
  document.getElementById("className").value = "";
  document.getElementById("surname").focus();
}

function sendResult(znamka, note, vysledekText) {
  const status = document.getElementById("sendStatus");

  if (!WEB_APP_URL) {
    status.textContent = "Výsledek nebyl odeslán – v HTML je nutné doplnit URL Apps Scriptu.";
    return;
  }

  const data = new URLSearchParams();
  data.append("timestamp", new Date().toISOString());
  data.append("aplikace", APP_NAME);
  data.append("trida", document.getElementById("className").value.trim());
  data.append("prijmeni", document.getElementById("surname").value.trim());
  data.append("jmeno", document.getElementById("surname").value.trim());
  data.append("vysledek", vysledekText || znamka);
  data.append("znamka", znamka);
  data.append("body", String(points));
  data.append("celkem", String(quiz.length));
  data.append("spravne", String(points));
  data.append("spatne", String(quiz.length - points));
  data.append("rezim", note.includes("opuštění") ? "PŘEKLIKNUTÍ" : "TEST");
  data.append("poznamka", note);
  data.append("odeslano", new Date().toLocaleString("cs-CZ"));
  data.append("technika", "skryty_formular_iframe");

  // Ověřená cesta z funkční aplikace Malý princ:
  // skutečné formulářové odeslání do skrytého iframe.
  const iframeName = "odesilaci_iframe";
  let iframe = document.querySelector('iframe[name="' + iframeName + '"]');
  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.style.display = "none";
    document.body.appendChild(iframe);
  }

  const form = document.createElement("form");
  form.method = "POST";
  form.action = WEB_APP_URL;
  form.target = iframeName;
  form.style.display = "none";

  for (const [key, value] of data.entries()) {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    form.appendChild(input);
  }

  document.body.appendChild(form);
  form.submit();
  status.textContent = "Výsledek byl odeslán do tabulky.";
  setTimeout(() => form.remove(), 1500);
}

/*
  Ochrana proti překliknutí:
  - krátké omylem vyvolané rozostření nestačí;
  - test se ukončí až při skutečném skrytí stránky delším než 1,2 s.
*/
document.addEventListener("visibilitychange", () => {
  if (!started || finished) return;

  if (document.hidden) {
    cheatTimer = setTimeout(() => {
      if (started && !finished && document.hidden) finishQuiz(true);
    }, 1200);
  } else {
    clearTimeout(cheatTimer);
  }
});

window.addEventListener("pagehide", () => {
  if (started && !finished) finishQuiz(true);
});
</script>
